<!-- DASHBOARD : contenu affiché dans la page principale (voir app.js) -->
<header>
    <h1 class="titre-logo"><img src="commun/logos/courses-192.png" alt="" width="56" height="56"> Dashboard</h1>
</header>

<div class="dashboard-grid">
    <div class="widget wheel-widget">
        <h2 class="widget-title">🎡 La Roue du Destin</h2>
        <div class="wheel-content">
            <div id="wheel-result">On fait quoi ce week-end ?</div>
            <button id="spin-btn">Tirer au sort !</button>
        </div>
    </div>
    <div class="widget time-widget">
        <div id="clock">00:00</div>
        <div id="date">Chargement...</div>
    </div>

    <!-- Widget Météo mis à jour (Cliquable) -->
    <div class="widget weather-widget-container" id="weather-widget" title="Cliquez pour les prévisions !">
        <h2 class="widget-title">🌤️ Météo (<span id="current-city-name">Pau</span>)</h2>
        <div class="weather-info">
            <div class="weather-temp" id="weather-temp">--°C</div>
            <div style="text-align: right;">
                <div class="weather-desc" id="weather-desc">Chargement...</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);" id="weather-minmax">Min: --° Max: --°</div>
            </div>
        </div>
        <!-- Petite icône indicative -->
        <div style="text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--accent);">
            👆 Voir les prévisions
        </div>
    </div>

    <!-- Listes partagées : une (ou plusieurs) liste de courses et de choses à faire -->
    <div class="listes-zone">
        <div class="widget liste-widget" data-type="courses">
            <h2 class="widget-title"><img class="widget-logo" src="commun/logos/courses-32.png" srcset="commun/logos/courses-192.png 2x" alt="" width="28" height="28"> Courses</h2>
            <div class="liste-outils">
                <select class="liste-choix" aria-label="Choisir la liste"></select>
                <button type="button" class="liste-bouton" data-action="partager">👥 Partager</button>
                <button type="button" class="liste-bouton icone" data-action="supprimer" aria-label="Supprimer cette liste" title="Supprimer cette liste">🗑️</button>
            </div>
            <form class="liste-ajout" autocomplete="off">
                <input type="text" maxlength="200" placeholder="Ajouter un article…" aria-label="Ajouter un article…">
                <button type="submit" aria-label="Ajouter">+</button>
            </form>
            <ul class="liste-articles"></ul>
            <div class="liste-vide" hidden></div>
        </div>
        <div class="widget liste-widget" data-type="taches">
            <h2 class="widget-title"><span class="widget-emoji" aria-hidden="true">✅</span> À faire</h2>
            <div class="liste-outils">
                <select class="liste-choix" aria-label="Choisir la liste"></select>
                <button type="button" class="liste-bouton" data-action="partager">👥 Partager</button>
                <button type="button" class="liste-bouton icone" data-action="supprimer" aria-label="Supprimer cette liste" title="Supprimer cette liste">🗑️</button>
            </div>
            <form class="liste-ajout" autocomplete="off">
                <input type="text" maxlength="200" placeholder="Ajouter une chose à faire…" aria-label="Ajouter une chose à faire…">
                <button type="submit" aria-label="Ajouter">+</button>
            </form>
            <ul class="liste-articles"></ul>
            <div class="liste-vide" hidden></div>
        </div>
    </div>
</div>

<!-- Modale (Fenêtre pop-up) pour les prévisions météo -->
<div id="weather-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="close-modal">&times;</span>
        <h2>Prévisions Météo</h2>
        
        <div class="city-selector">
            <input type="text" id="city-input" placeholder="Tapez une ville (ex: Tokyo, Pau...)" />
            <button id="search-city-btn">Rechercher</button>
        </div>

        <div id="forecast-loader" style="text-align: center; margin: 20px 0;">Chargement des prévisions...</div>
        
        <div id="forecast-container" class="forecast-grid">
            <!-- Les prévisions 5 jours apparaîtront ici -->
        </div>
        <!-- NOUVEAU : Conteneur pour les prévisions détaillées (caché par défaut) -->
        <div id="hourly-container" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--line);">
            <h3 id="hourly-title" style="margin-bottom: 15px; font-size: 1.1rem; color: var(--text-main);">Détails</h3>
            <div id="hourly-forecast-list" class="hourly-grid">
                <!-- Les prévisions toutes les 3h s'afficheront ici -->
            </div>
        </div>
    </div>
</div>
